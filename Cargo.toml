[package]
name = "inventory"
# Cargo requires a semver field. Releases are identified only by the build
# date/time stamp written to version.txt and the Windows file properties.
version = "1.0.3"
edition = "2021"
rust-version = "1.88"
description = "Portable laboratory inventory desktop application"
authors = ["Inventory"]
build = "build.rs"

[[bin]]
name = "Inventory"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
calamine = "0.37"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8.2"
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false }
self-replace = "1.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tao = "0.37"
ureq = "3.5.2"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

[dev-dependencies]
rust_xlsxwriter = "0.102.0"
